  # ---------------- Analog inputs ----------------
  # getAdcChannelBrainPin in 'stm32_adc.cpp': EFI_ADC_0 is PA0, EFI_ADC_1 is PA1 ... EFI_ADC_10 is PC0, EFI_ADC_11 is PC1
  # PA3 (EFI_ADC_3) is reserved for knock and intentionally not listed here
  - id: EFI_ADC_0
    class: analog_inputs
    ts_name: O2 Sensor (A0)

  - id: EFI_ADC_1
    class: analog_inputs
    ts_name: Analog Spare 3 (A1)

  - id: EFI_ADC_2
    class: analog_inputs
    ts_name: TPS1 (A2)

  - id: EFI_ADC_4
    class: analog_inputs
    ts_name: CLT Sensor (A4)

  - id: EFI_ADC_5
    class: analog_inputs
    ts_name: IAT Sensor (A5)

  - id: EFI_ADC_7
    class: analog_inputs
    ts_name: Battery Voltage (A7)

  - id: EFI_ADC_8
    class: analog_inputs
    ts_name: Analog Spare 1 (B0)

  - id: EFI_ADC_9
    class: analog_inputs
    ts_name: Analog Spare 2 (B1)

  - id: EFI_ADC_10
    class: analog_inputs
    ts_name: MAP Sensor (C0)

  - id: EFI_ADC_11
    class: analog_inputs
    ts_name: Analog Spare 4 (C1)

  # ---------------- Digital inputs ----------------
  - id: [D3, D3]
